<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>Gemini Chat Exporter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
      font-size: 14px;
      background: #1e1e2e;
      color: #cdd6f4;
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .header h1 {
      font-size: 15px;
      font-weight: 600;
      color: #cba6f7;
    }

    .options {
      background: #313244;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .option-row {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .option-row input[type="checkbox"] {
      width: 15px;
      height: 15px;
      accent-color: #cba6f7;
      cursor: pointer;
      flex-shrink: 0;
    }

    .option-row label {
      cursor: pointer;
      line-height: 1.3;
      color: #cdd6f4;
    }

    .option-row .hint {
      font-size: 11px;
      color: #7f849c;
      margin-top: 1px;
    }

    .sub-options {
      margin-left: 23px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .sub-options.hidden {
      display: none;
    }

    .divider {
      height: 1px;
      background: #45475a;
      margin: 10px 0;
    }

    .btn {
      width: 100%;
      padding: 10px 14px;
      margin-bottom: 8px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: opacity 0.15s;
    }

    .btn:last-of-type { margin-bottom: 0; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn:not(:disabled):hover { opacity: 0.88; }

    #btn-download {
      background: #cba6f7;
      color: #1e1e2e;
    }

    #btn-clipboard {
      background: #89b4fa;
      color: #1e1e2e;
    }

    .status-area {
      margin-top: 10px;
      min-height: 20px;
      font-size: 12px;
      line-height: 1.4;
    }

    #status { color: #a6e3a1; }
    #error  { color: #f38ba8; }

    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 4px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="header">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z" stroke="#cba6f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="14 2 14 8 20 8" stroke="#cba6f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="16" y1="13" x2="8" y2="13" stroke="#89b4fa" stroke-width="2" stroke-linecap="round"/>
      <line x1="16" y1="17" x2="8" y2="17" stroke="#89b4fa" stroke-width="2" stroke-linecap="round"/>
      <polyline points="10 9 9 9 8 9" stroke="#89b4fa" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <h1>Gemini Chat Exporter</h1>
  </div>

  <div class="options">
    <div class="option-row">
      <input type="checkbox" id="opt-scroll" checked>
      <div>
        <label for="opt-scroll">自动滚动加载全部消息</label>
        <div class="hint">取消则只导出当前可见内容</div>
      </div>
    </div>
    <div class="option-row">
      <input type="checkbox" id="opt-images" checked>
      <label for="opt-images">包含图片</label>
    </div>
    <div class="sub-options" id="image-sub-options">
      <div class="option-row">
        <input type="checkbox" id="opt-remote-images">
        <div>
          <label for="opt-remote-images">下载远程图片</label>
          <div class="hint">默认仅保存本地上传图片</div>
        </div>
      </div>
      <div class="option-row">
        <input type="checkbox" id="opt-zip">
        <div>
          <label for="opt-zip">打包为 ZIP</label>
          <div class="hint">否则图片内联到 Markdown</div>
        </div>
      </div>
    </div>
  </div>

  <button class="btn" id="btn-download">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="7 10 12 15 17 10"/>
      <line x1="12" y1="15" x2="12" y2="3"/>
    </svg>
    <span id="btn-download-text">下载 .md 文件</span>
  </button>

  <button class="btn" id="btn-clipboard">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
      <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
    </svg>
    复制到剪贴板
  </button>

  <div class="status-area">
    <div id="status"></div>
    <div id="error"></div>
  </div>

  <script src="../lib/jszip.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
